<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <!-- Sidebar Header -->
    <mat-toolbar color="primary" class="sidebar-header">
      <mat-icon>article</mat-icon>
      <span class="sidebar-title">Angular Blog</span>
    </mat-toolbar>

    <!-- Navigation Menu -->
    <mat-nav-list class="sidebar-nav">
      @for (item of navigationItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }

      <!-- Divider -->
      <mat-divider></mat-divider>

      <!-- Authentication Section -->
      @if (isAuthenticated()) {
        <!-- User Info -->
        <div class="user-info-section">
          <mat-list-item>
            <mat-icon matListItemIcon>account_circle</mat-icon>
            <span matListItemTitle>{{ username() }}</span>
          </mat-list-item>
        </div>

        <!-- Create Blog Button (only if user has role) -->
        @if (canAddBlog()) {
          <button
            mat-list-item
            (click)="goToAddBlog()"
            (keydown.enter)="goToAddBlog()"
            class="create-blog-btn"
            tabindex="0"
          >
            <mat-icon matListItemIcon>add</mat-icon>
            <span matListItemTitle>Create New Blog</span>
          </button>
        }

        <!-- Logout -->
        <button mat-list-item (click)="logout()" (keydown.enter)="logout()" tabindex="0">
          <mat-icon matListItemIcon>logout</mat-icon>
          <span matListItemTitle>Logout</span>
        </button>
      } @else {
        <!-- Login -->
        <button mat-list-item (click)="login()" (keydown.enter)="login()" tabindex="0">
          <mat-icon matListItemIcon>login</mat-icon>
          <span matListItemTitle>Login</span>
        </button>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <!-- Top Toolbar -->
    <mat-toolbar color="primary" class="top-toolbar">
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="toolbar-title">Angular Blog</span>

      <div class="spacer"></div>

      <!-- Language Switcher -->
      <app-language-switcher></app-language-switcher>

      <!-- Dark Mode Toggle -->
      <button mat-icon-button (click)="toggleDarkMode()" matTooltip="Toggle Dark Mode">
        <mat-icon>dark_mode</mat-icon>
      </button>
    </mat-toolbar>

    <!-- Content Area -->
    <div class="content-area">
      <ng-content></ng-content>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
